plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ylports.warioland4'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ylports.warioland4'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0-memory-host'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

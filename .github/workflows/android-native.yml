name: Android native foundation CI

on:
  push:
    branches: [android-native]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test portable tile decoder
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            android/app/src/main/cpp/rom_assets.cpp \
            android/tests/test_rom_assets.cpp -o /tmp/wl4-assets-test
          /tmp/wl4-assets-test
      - name: Test native BG/OBJ renderer and GBA frame clock
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            android/app/src/main/cpp/gba_video.cpp \
            android/app/src/main/cpp/frame_clock.cpp \
            android/tests/test_gba_video.cpp -o /tmp/wl4-video-test
          /tmp/wl4-video-test
      - name: Test native memory bus, input registers and SRAM persistence
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            android/app/src/main/cpp/native_memory.cpp \
            android/tests/test_native_memory.cpp -o /tmp/wl4-memory-test
          /tmp/wl4-memory-test
      - name: Compile and test original decompiled fixed-point C routines
        run: |
          cc -std=gnu11 -Iinclude -Wall -Wextra -c src/fixed_point.c -o /tmp/wl4-fixed-point.o
          c++ -std=c++17 -Wall -Wextra -Werror -Iinclude \
            android/tests/test_original_fixed_point.cpp /tmp/wl4-fixed-point.o \
            -o /tmp/wl4-fixed-point-test
          /tmp/wl4-fixed-point-test
      - name: Test original input, screen shake and IRQ callback C modules
        run: |
          mkdir -p /tmp/wl4-native-objects
          for file in wl4_host_game_globals src/init_helpers src/screen_shake src/interrupt_callbacks; do
            if [ "$file" = wl4_host_game_globals ]; then source=android/app/src/main/cpp/wl4_host_game_globals.c; else source="$file.c"; fi
            cc -std=gnu11 -DWL4_ANDROID_NATIVE -Iandroid/app/src/main/cpp \
              -Wall -Wextra -Werror -c "$source" \
              -o "/tmp/wl4-native-objects/${file##*/}.o"
          done
          c++ -std=c++17 -Wall -Wextra -Werror \
            android/tests/test_original_host_modules.cpp \
            /tmp/wl4-native-objects/*.o -o /tmp/wl4-original-host-test
          /tmp/wl4-original-host-test
      - name: Test original main.c soft-reset handler
        run: |
          cc -std=gnu11 -DWL4_ANDROID_NATIVE -Iandroid/app/src/main/cpp -Wall -Wextra -Werror -c src/main.c -o /tmp/wl4-main-host.o
          cc -std=gnu11 -DWL4_ANDROID_NATIVE -Iandroid/app/src/main/cpp -Wall -Wextra -Werror -c src/init_helpers.c -o /tmp/wl4-input-host.o
          cc -std=gnu11 -DWL4_ANDROID_NATIVE -Iandroid/app/src/main/cpp -Wall -Wextra -Werror -c android/app/src/main/cpp/wl4_host_game_globals.c -o /tmp/wl4-global-host.o
          c++ -std=c++17 -Wall -Wextra -Werror android/tests/test_original_soft_reset.cpp \
            /tmp/wl4-main-host.o /tmp/wl4-input-host.o /tmp/wl4-global-host.o -o /tmp/wl4-reset-test
          /tmp/wl4-reset-test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build ARM64 debug milestone
        run: gradle -p android --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: warioland4-android-original-main-module-0.5-not-playable
          path: android/app/build/outputs/apk/debug/app-debug.apk

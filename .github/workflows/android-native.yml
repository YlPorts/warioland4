name: Android native foundation CI

on:
  push:
    branches: [android-native]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test portable tile decoder
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            android/app/src/main/cpp/rom_assets.cpp \
            android/tests/test_rom_assets.cpp -o /tmp/wl4-assets-test
          /tmp/wl4-assets-test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build ARM64 debug milestone
        run: gradle -p android --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: warioland4-android-foundation-debug-not-playable
          path: android/app/build/outputs/apk/debug/app-debug.apk
